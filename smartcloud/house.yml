# yaml-language-server: $schema=https://raw.githubusercontent.com/Resnovas/smartcloud/main/schema/smartcloud.schema.json
#
# The Resnovas house preset. Every Resnovas repository extends it from its
# .github/smartcloud.yml:
#
#   extends:
#     - Resnovas/.github/smartcloud/house.yml@main
#
# It is house-base.yml, which holds every other house value, plus the two
# default branch ruleset gates that spend GitHub AI credits. Change the other
# values in house-base.yml. Presets are locked: a repository may add keys
# neither file sets, but it cannot change a value set in either.
version: 2
extends:
  - Resnovas/.github/smartcloud/house-base.yml@main

settings:
  ruleset:
    # Code Quality findings gate merges at errors; its scans spend AI credits.
    codeQuality: errors
    # Copilot reviews drafts and every push; its reviews spend AI credits.
    copilotReview: true
