# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/smartcloud.yml. Edits inside this block are overwritten.
#
# Runs smartcloud with the house preset (.github/smartcloud.yml): the pull
# request policy and review gate, label sync, repository settings and the
# weekly house sync. On pull requests the job also waits for every other check
# and passes only when they all have, so its "smartcloud" check is the one
# aggregate check the house ruleset requires on the default branch. The default
# branch merges through a merge queue, so the workflow also runs on
# merge_group. The job is skipped there, which GitHub reports as a success: the
# policy was checked on the pull request, and a queued group needs no label or
# settings run.
#
# Every event acts with a Resnovas Bot GitHub App token, minted from the
# organisation variable RESNOVAS_BOT_APP_ID and secret RESNOVAS_BOT_PRIVATE_KEY,
# because the workflow token can neither read the private preset in
# Resnovas/.github, push workflow files nor change repository settings. The
# token reaches only this repository and Resnovas/.github; GitHub signs the
# sync commits made with it, and its rate limit is the app's own. Pull
# requests from forks and Dependabot get no secrets, so no token is minted:
# they fall back to the workflow token, and smartcloud then runs restricted.
# It skips the private preset, settings, sync and any write the token is
# refused, and lists them in the job summary. Forks and Dependabot runs are
# restricted whatever token is passed. The job runs a released smartcloud,
# never the pull request's code.
name: smartcloud

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

# A newer run on the same pull request, issue or branch replaces an older one
# on the same event, so retriggered runs never wait beside each other.
concurrency:
  group: smartcloud-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  smartcloud:
    name: smartcloud
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Without the app's credentials, as in a repository outside the
    # organisation, the mint is skipped rather than attempted with empty inputs.
    env:
      HAS_APP_KEY: ${{ vars.RESNOVAS_BOT_APP_ID != '' && secrets.RESNOVAS_BOT_PRIVATE_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
      statuses: read
    steps:
      - name: Repositories the token may reach
        id: scope
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$name" = .github ]; then echo "repositories=.github"; else echo "repositories=$name,.github"; fi >> "$GITHUB_OUTPUT"

      # A failed mint falls back to the workflow token rather than failing the run.
      - name: Mint the Resnovas Bot token
        id: app
        if: env.HAS_APP_KEY == 'true' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        continue-on-error: true
        # The token keeps the app's full permission set, which settings, sync,
        # labels and checks need between them; it is scoped to this repository
        # and .github, and never minted for forks or Dependabot.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          # GitHub accepts the App ID wherever the client ID is asked for.
          client-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}
          owner: Resnovas
          repositories: ${{ steps.scope.outputs.repositories }}

      - uses: resnovas/smartcloud@v2
        with:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          # Lets the required feature wait for the other checks and leave this job out.
          checkRunId: ${{ job.check_run_id }}
# house:managed:end
