# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/smartcloud.yml. Edits inside this block are overwritten.
#
# Runs smartcloud with the house preset (.github/smartcloud.yml): the pull
# request policy and review gate, label sync, repository settings and the
# weekly house sync. Once the preset lists two or more maintainers, the house
# ruleset makes this job's "smartcloud" check required on the default branch.
#
# Pull request and issue events act with the workflow token. Repository events
# act as the House sync GitHub App, because the workflow token can neither
# push workflow files nor change repository settings. The organisation sets
# HOUSE_SYNC_APP_ID and HOUSE_SYNC_APP_PRIVATE_KEY once.
name: smartcloud

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  smartcloud:
    name: smartcloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    steps:
      - name: Mint app token
        id: app
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOUSE_SYNC_APP_ID }}
          private-key: ${{ secrets.HOUSE_SYNC_APP_PRIVATE_KEY }}

      - uses: resnovas/smartcloud@v2
        with:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
