# Checks for this repository itself: rendered runs static and consistency
# gates first, then the test matrix runs policy and renderer tests on Linux,
# macOS and Windows with Node 24 and the current release. The check job
# waits for both and is the one context the ruleset
# and the merge queue require, so adding a job never touches the ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The default branch merges through a merge queue, which needs the required
  # "check" context on every queued group.
  merge_group:

# Each job asks for the access it needs; the workflow grants none.
permissions: {}

jobs:
  # The renderer and the synced tools run on contributors' machines, so the
  # tests run on Linux, macOS and Windows, each on Node 24, the minimum, and
  # the current release. Every combination runs to the end.
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: rendered
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', current]
    steps:
      # Windows checks text files out with CRLF by default, which the
      # line-based tests would misread.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked lint tooling
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Collect affected funnel evidence
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        env:
          FUNNEL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node --run verify:evidence

      - name: Validate publication evidence
        id: publication
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        env:
          FUNNEL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node --run verify:evidence:check

      - name: Upload reviewed synthetic evidence
        if: ${{ !cancelled() && steps.publication.outcome == 'success' && hashFiles('.verification/publish/manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-funnel-evidence
          path: .verification/publish/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  rendered:
    name: rendered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked lint tooling
        run: npm ci --ignore-scripts

      - name: Static checks first
        run: node --run verify:static

      - name: Rendered files are up to date
        run: npm run check

  # The required context. It runs even when a job above fails or is cancelled,
  # and passes only when every job succeeded.
  check:
    name: check
    needs: [test, rendered]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::Not every CI job passed:"
            echo "$failed"
            exit 1
          fi
          echo "Every job passed."
