# Checks for this repository itself: the policy and renderer tests, and that
# the rendered files at the root match templates/ and house.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job asks for the access it needs; the workflow grants none.
permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Rendered files are up to date
        run: npm run check
