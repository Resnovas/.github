# Reusable release. A repository's synced house-release.yml calls it from the
# default branch; release.config.json in the repository says what it ships.
#
# Conventional commits since the last v* tag decide the version; the tag, not a
# file on the branch, holds the current version. tools/release/release.ts bumps
# the released projects' versions, builds the bundles the config lists, commits
# both in a release commit on no branch (without the paths the config drops),
# and pushes only the v<version> tag, so the default branch never holds a
# release commit or a bundle and no branch protection is bypassed. It writes
# the release notes to a draft GitHub release and, with majorTag, moves the
# v<major> tag.
#
# Nx writes the same notes to CHANGELOG.md and each app's CHANGELOG.md. They
# reach the default branch through a pull request: the changelogs job commits
# them through the GitHub API as the house app, so the commit is signed by
# GitHub, and opens "chore(release): changelogs for v<version>". The app's
# token is minted only in that job, which checks out and runs none of the
# repository's code; the release job hands it the files as an artifact.
#
# The artifacts job checks out the tag, refuses to go on unless each tagged
# bundle is what that tag's source builds, generates an SBOM per shipped
# package and, with an npm section, publishes the package with provenance
# through trusted publishing. The attest job then signs build provenance for
# the checked bundles and attaches the SBOMs to the draft release, through
# attest.yml, and the publish-release job publishes it. The release stays a
# draft until then because immutable releases lock a published release's
# assets.
#
# Every bundle's source map is uploaded to error tracking for the release and
# then deleted, so neither the tag nor npm ships one, when the caller passes
# POSTHOG_CLI_API_KEY and the config names a project.
name: Release

on:
  workflow_call:
    inputs:
      dry-run:
        description: Print the version and release notes without tagging, releasing or publishing
        type: boolean
        default: true
      specifier:
        description: Override the conventional commits, with a version (2.0.0) or a bump (major, minor, patch)
        type: string
        required: false
      first-release:
        description: No v* tag exists yet (the first release only)
        type: boolean
        default: false
    secrets:
      POSTHOG_CLI_API_KEY:
        description: A PostHog personal API key (error tracking write, organization read) for the source maps; optional
        required: false
      RESNOVAS_BOT_PRIVATE_KEY:
        description: The house app's private key, for the changelog pull request; required for a real release
        required: false

permissions: {}

jobs:
  # Reads release.config.json without installing anything, so the later jobs
  # know what the repository ships before they run its code.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundles: ${{ steps.read.outputs.bundles }}
      npm: ${{ steps.read.outputs.npm }}
      apps: ${{ steps.read.outputs.apps }}
      # The first bundle's project as an SBOM file stem (see sbomFileName in tools/release/config.ts), or empty.
      sbom: ${{ steps.read.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: |
          set -euo pipefail
          test -f release.config.json || { echo '::error::release.config.json is missing; the house release workflow needs it (see docs/workflows.md in Resnovas/.github)'; exit 1; }
          jq -e 'type == "object"' release.config.json > /dev/null
          {
            echo "bundles=$(jq -c '.bundles // []' release.config.json)"
            echo "npm=$(jq -c '.npm // {}' release.config.json)"
            echo "apps=$(jq -c '.apps // []' release.config.json)"
            echo "sbom=$(jq -r '(.bundles // [])[0].project // "" | ltrimstr("@") | gsub("/"; "-")' release.config.json)"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Releases come only from the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    outputs:
      base: ${{ steps.release.outputs.base }}
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The changelogs job needs the app, so a real release stops before it tags anything without it.
      - name: Check the house app is configured
        if: ${{ !inputs.dry-run }}
        env:
          HAS_APP: ${{ vars.RESNOVAS_BOT_APP_ID != '' && secrets.RESNOVAS_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP" != 'true' ]; then
            echo '::error::set the RESNOVAS_BOT_APP_ID variable and the RESNOVAS_BOT_PRIVATE_KEY secret; see docs/workflows.md in Resnovas/.github'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx reads the conventional commits and v* tags from the full history.
          fetch-depth: 0
          fetch-tags: true
          # The script pushes the release tag with git.
          persist-credentials: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version, tag and write the release notes
        id: release
        env:
          # Nx's GitHub client, which the release notes are rendered with, uses this token.
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          DRY_RUN: ${{ inputs.dry-run }}
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first-release }}
        run: |
          args=()
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          if [ "$FIRST_RELEASE" = 'true' ]; then args+=(--first-release); fi
          if [ -n "$SPECIFIER" ]; then args+=(--specifier "$SPECIFIER"); fi
          node tools/release/release.ts "${args[@]}"

      - name: Keep the changelog files for the changelogs job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelogs
          path: |
            CHANGELOG.md
            **/CHANGELOG.md
            !node_modules/**
            !externals/**
          if-no-files-found: error
          retention-days: 7

      - name: Keep the release notes for the draft-release job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ steps.release.outputs.notes }}
          if-no-files-found: error
          retention-days: 7

  # Creates the GitHub release, as a draft, from the notes release.ts wrote.
  # A separate job, so a failed GitHub request is retried by re-running it
  # alone: the tag is already pushed, and the release job cannot run twice.
  # It reuses a release a previous attempt created.
  draft-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          [ "$TAG" = "v$VERSION" ] || { echo "::error::unexpected tag: $TAG"; exit 1; }
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          id=${id%%$'\n'*}
          if [ -z "$id" ]; then
            prerelease=false
            if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --field tag_name="$TAG" --field name="$TAG" \
              --field body=@release-notes.md --field draft=true --field prerelease="$prerelease" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  changelogs:
    needs: [config, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every write goes through the app's token.
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelogs
          path: changelogs

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # A commit made through the API with an app token is signed by GitHub, so
      # it passes a signed-commits rule. Its author is the app's bot account,
      # which signs it off for the DCO check. It branches from the commit the
      # release was cut from, so if the branch has changed the changelogs
      # since, the pull request shows a conflict rather than dropping those
      # changes.
      - name: Open the changelog pull request
        working-directory: changelogs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.release.outputs.version }}
          BASE: ${{ needs.release.outputs.base }}
          APPS: ${{ needs.config.outputs.apps }}
        run: |
          set -euo pipefail
          # The outputs come from the job that ran repository code, so check
          # them before this token acts on them: a version, and a commit on the branch.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected base commit: $BASE"; exit 1; }
          case "$(gh api "repos/$REPO/compare/$BASE...$DEFAULT_BRANCH" --jq .status)" in
            ahead | identical) ;;
            *) echo "::error::$BASE is not on $DEFAULT_BRANCH"; exit 1 ;;
          esac
          branch="release/changelogs-v$VERSION"
          title="chore(release): changelogs for v$VERSION"
          base_tree=$(gh api "repos/$REPO/git/commits/$BASE" --jq .tree.sha)

          # Only the known changelog paths, whatever else the artifact holds:
          # the root changelog and one per app the config lists.
          tree='[]'
          for file in CHANGELOG.md $(jq -r '.[] | select(test("^[A-Za-z0-9_./-]+$")) | . + "/CHANGELOG.md"' <<<"$APPS"); do
            [ -f "$file" ] || continue
            blob=$(base64 --wrap=0 "$file" | jq --raw-input '{content: ., encoding: "base64"}' |
              gh api "repos/$REPO/git/blobs" --input - --jq .sha)
            tree=$(jq --arg path "$file" --arg sha "$blob" '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"$tree")
          done
          tree=$(jq --arg base "$base_tree" '{base_tree: $base, tree: .}' <<<"$tree" |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)

          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          message=$(printf '%s\n\nSigned-off-by: %s[bot] <%s+%s[bot]@users.noreply.github.com>' "$title" "$APP_SLUG" "$user_id" "$APP_SLUG")
          commit=$(jq --null-input --arg message "$message" --arg tree "$tree" --arg parent "$BASE" \
            '{message: $message, tree: $tree, parents: [$parent]}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)

          # A rerun finds the branch and pull request from the first attempt:
          # point the branch at the new commit and keep the open pull request.
          if gh api "repos/$REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/$branch" --field sha="$commit" --field force=true --silent
          else
            gh api "repos/$REPO/git/refs" --field ref="refs/heads/$branch" --field sha="$commit" --silent
          fi
          if [ "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq length)" -gt 0 ]; then
            exit 0
          fi
          gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$branch" --title "$title" --body "$(cat <<EOF
          The workspace and app changelogs for [v$VERSION](https://github.com/$REPO/releases/tag/v$VERSION), written by the release workflow. The GitHub release holds the same notes.

          Merge it before the next release, which builds on these files.
          EOF
          )"

  # Checks out the tag, proves each bundle is what its source builds, writes
  # the SBOMs, and publishes to npm when the config asks for it.
  artifacts:
    needs: [config, release]
    if: needs.release.outputs.released == 'true' && (needs.config.outputs.bundles != '[]' || needs.config.outputs.npm != '{}')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it writes an auth token that would stop npm using
      # trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tagged bundle carries the error tracking chunk id, which is derived
      # from its content, so the rebuild goes through the same source map step
      # before it is compared.
      - name: Check each tagged bundle is the released code
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          BUNDLES: ${{ needs.config.outputs.bundles }}
          STAGE: ${{ runner.temp }}/release-files
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          jq -c '.[]' <<<"$BUNDLES" | while read -r bundle; do
            target=$(jq -r .target <<<"$bundle"); output=$(jq -r .output <<<"$bundle")
            [[ "$output" =~ ^[A-Za-z0-9_./-]+$ && "$target" =~ ^[@A-Za-z0-9_./:-]+$ ]] || { echo "::error::unexpected bundle: $bundle"; exit 1; }
            test -f "$output" || { echo "::error::the release has no $output"; exit 1; }
            cp "$output" "$RUNNER_TEMP/tagged.js"
            pnpm nx run "$target" --skip-nx-cache
            node tools/release/sourcemaps.ts "$VERSION" "$output"
            cmp "$output" "$RUNNER_TEMP/tagged.js" || { echo "::error::$output in the release does not match its source"; exit 1; }
            mkdir -p "$STAGE/$(dirname "$output")"
            cp "$output" "$STAGE/$output"
          done

      # One SPDX SBOM per shipped package, of its production dependencies,
      # including the workspace libraries bundled into it.
      - name: Write the SBOMs
        env:
          BUNDLES: ${{ needs.config.outputs.bundles }}
          NPM: ${{ needs.config.outputs.npm }}
          STAGE: ${{ runner.temp }}/release-files
        run: |
          set -euo pipefail
          filters=$(jq -r '[.[] | .project // empty] | map(select(test("^[@A-Za-z0-9_./-]+$"))) | map("--filter=" + .) | join(" ")' <<<"$BUNDLES")
          filters="$filters $(jq -r '(.sbomProjects // []) | map(select(test("^[@A-Za-z0-9_./-]+$"))) | map("--filter=" + .) | join(" ")' <<<"$NPM")"
          if [ -z "${filters// /}" ]; then echo 'No packages to describe.'; exit 0; fi
          # shellcheck disable=SC2086
          pnpm $filters sbom --sbom-format spdx --sbom-type application --prod --lockfile-only --split --out "$STAGE/%s-%v.spdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
          if-no-files-found: error

      # Trusted publishing needs npm 11.5 or later, newer than the runner's.
      - name: Update npm for trusted publishing
        if: needs.config.outputs.npm != '{}'
        run: npm install --global npm@latest # zizmor: ignore[adhoc-packages]

      # The tag's package.json files carry the released version, which the bundles stamp in.
      - name: Build, prepare and publish the npm package
        if: needs.config.outputs.npm != '{}'
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          NPM: ${{ needs.config.outputs.npm }}
        run: |
          set -euo pipefail
          directory=$(jq -r .directory <<<"$NPM")
          [[ "$directory" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::unexpected npm.directory: $directory"; exit 1; }
          for target in $(jq -r '(.bundleTargets // [])[] | select(test("^[@A-Za-z0-9_./:-]+$"))' <<<"$NPM"); do
            pnpm nx run "$target" --skip-nx-cache
          done
          # Upload the package's source maps and drop them, so npm ships the bundles only.
          maps=$(find "$directory" -name '*.js.map' -maxdepth 1 | sed 's/\.map$//')
          if [ -n "$maps" ]; then
            # shellcheck disable=SC2086
            node tools/release/sourcemaps.ts "$VERSION" $maps
          fi
          prepare=$(jq -r '.prepare // empty' <<<"$NPM")
          if [ -n "$prepare" ]; then
            allowed='^(node|pnpm|npm) [A-Za-z0-9_./:@ -]+$'
            [[ "$prepare" =~ $allowed ]] || { echo "::error::npm.prepare must be a node, pnpm or npm command: $prepare"; exit 1; }
            # shellcheck disable=SC2086
            $prepare
          fi
          cd "$directory"
          npm publish --provenance --access public

  # Signs build provenance for the released bundles, binds the first one's SBOM
  # to it and attaches the SBOMs to the GitHub release, through attest.yml.
  attest:
    needs: [config, release, draft-release, artifacts]
    if: needs.config.outputs.bundles != '[]'
    uses: Resnovas/.github/.github/workflows/attest.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      artifact: release-files
      subject-path: ${{ join(fromJSON(needs.config.outputs.bundles).*.output, '
        ') }}
      sbom-path: ${{ needs.config.outputs.sbom && format('{0}-{1}.spdx.json', needs.config.outputs.sbom, needs.release.outputs.version) || '' }}
      release: ${{ needs.release.outputs.tag }}
      release-assets: '*.spdx.json'

  # Publishes the draft release once its files are attached; a published
  # release takes no new assets. Runs when there was nothing to attest too.
  publish-release:
    needs: [config, draft-release, artifacts, attest]
    if: always() && needs.draft-release.result == 'success' && needs.artifacts.result != 'failure' && needs.attest.result != 'failure' && needs.artifacts.result != 'cancelled' && needs.attest.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft-release.outputs.id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "::error::unexpected release id: $RELEASE_ID"; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --field draft=false --field make_latest=legacy --silent
