# Reusable OpenSSF Scorecard. Repositories call it through the
# house-scorecard.yml workflow synced from templates/.github/workflows.
#
# Scorecard scores the repository's supply-chain practices: pinned
# dependencies, token permissions, branch protection, dangerous workflows,
# code review, signed releases and more. The results go to code scanning, where
# each failing check is an alert with its remediation, and a public repository
# publishes them to the OpenSSF API, which serves the README badge and the
# viewer at scorecard.dev. The action publishes nothing for a private one.
#
# Scorecard runs only on the default branch, so the job skips any other ref.
# Publishing requires this file to keep the action's workflow restrictions: no
# workflow or job env or defaults, no containers or services, write permissions
# only on the job, and only actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action and
# step-security/harden-runner as steps. Uses only the workflow token, never a
# personal access token, so the Branch-Protection check scores what a
# read-only token can see.
name: Scorecard

on:
  workflow_call:

permissions: {}

jobs:
  scorecard:
    name: scorecard
    # A schedule always runs on the default branch, and its payload carries no
    # repository to compare against.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Sign the results the OpenSSF API verifies before publishing them.
      id-token: write
      # Read the code and workflows, including in a private repository.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
