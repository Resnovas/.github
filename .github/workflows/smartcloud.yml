# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/smartcloud.yml. Edits inside this block are overwritten.
#
# Runs smartcloud with the house preset (.github/smartcloud.yml): the pull
# request policy and review gate, label sync, repository settings and the
# weekly house sync. Once the preset lists two or more maintainers, the house
# ruleset makes this job's "smartcloud" check required on the default branch.
#
# Every event acts with the organisation secret ACCESS_TOKEN, because the
# workflow token can neither read the private preset in Resnovas/.github, push
# workflow files nor change repository settings. Runs without the secret, such
# as pull requests from forks and Dependabot, fall back to the workflow token,
# and smartcloud then runs restricted: it skips the private preset, settings,
# sync and any write the token is refused, and lists them in the job summary.
# Forks and Dependabot runs are restricted whatever token is passed. The job
# runs a released smartcloud, never the pull request's code.
name: smartcloud

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  smartcloud:
    name: smartcloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    steps:
      - uses: resnovas/smartcloud@v2
        with:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
