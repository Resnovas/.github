# Scheduled publication for migrated callers. graphify.yml remains unchanged
# for enrolled repositories outside the approved Eventiva/house rollout.
name: Graphify navigation snapshot

on:
  workflow_call:
    inputs:
      publication-message:
        type: string
        required: true
      app-id:
        type: string
        required: true
    secrets:
      private-key:
        required: true

permissions: {}

concurrency:
  group: graphify-snapshot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (github.repository == 'Resnovas/Eventiva' || github.repository == 'Resnovas/.github')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Start from trusted main history, then select the captured event SHA.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Generate navigation with provenance
        id: generate
        env:
          SOURCE_SHA: ${{ github.sha }}
          GRAPHIFY_PUBLICATION_MESSAGE: ${{ inputs.publication-message }}
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout -B main "$SOURCE_SHA"
          sh tools/graphify/graphify setup --no-hooks
          sh tools/graphify/graphify snapshot
          test -z "$(git status --porcelain)"
          mkdir -p graphify-snapshot
          cp graphify-out/snapshot/graph.json graphify-snapshot/graph.json
          cp graphify-out/snapshot/provenance.json graphify-snapshot/provenance.json
          git add -- graphify-snapshot/graph.json graphify-snapshot/provenance.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            node tools/dev/commit-check.mjs --message "$GRAPHIFY_PUBLICATION_MESSAGE"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish revision-labelled snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            graphify-out/snapshot/graph.json
            graphify-out/snapshot/provenance.json
          if-no-files-found: error
          retention-days: 7
      # The app token triggers the normal PR checks; the workflow token would
      # suppress those events. Never bypass protection or push directly to main.
      - name: Mint publication token
        id: app
        if: steps.generate.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Resolve publication identity
        id: identity
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "committer=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - name: Propose signed navigation update
        if: steps.generate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          base: main
          branch: house/graphify-navigation
          sign-commits: true
          committer: ${{ steps.identity.outputs.committer }}
          author: ${{ steps.identity.outputs.committer }}
          add-paths: |
            graphify-snapshot/graph.json
            graphify-snapshot/provenance.json
          commit-message: ${{ inputs.publication-message }}
          title: 'chore(graphify): update shared navigation'
          body: |
            ## What changed and why

            Updates only the shared navigation snapshot from main revision ${{ github.sha }}.
            Checkout-local graphs and caches remain ignored and are not published.
            Generation ran in the scheduled/manual main workflow, never in a PR workflow.

            ## Evidence

            Source revision, generator version and fingerprints are in graphify-snapshot/provenance.json.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Normal required checks and review still apply; this workflow never merges the PR.

            ## AI disclosure

            AI level: unassisted
            AI tools: none
      - name: Record publication result
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        run: |
          printf 'Graphify navigation snapshot for %s: **%s**.\n\nThis is not PR acceptance or a freshness merge gate.\n' "$SOURCE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
