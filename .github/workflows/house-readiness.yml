# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/house-readiness.yml. Edits inside this block are overwritten.
# Uses only trusted base-branch code and GitHub metadata, never a PR checkout.
name: house human readiness

# The target event supplies draft-restoration permission for forks too; no PR code runs.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [ready_for_review]

permissions: {}

concurrency:
  group: house-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  restore-draft:
    if: github.event.sender.login == 'linear-code[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Restore Linear-converted drafts without overriding later human readiness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process')
          const { REPOSITORY, NUMBER, SENDER } = process.env
          if (SENDER !== 'linear-code[bot]') throw new Error('Only Linear readiness events may restore drafts.')
          if (!/^[\w.-]+\/[\w.-]+$/.test(REPOSITORY) || !/^[1-9]\d*$/.test(NUMBER)) throw new Error('Invalid repository or PR number.')
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', timeout: 30000, maxBuffer: 16 * 1024 * 1024 })
          const pr = JSON.parse(gh('api', `repos/${REPOSITORY}/pulls/${NUMBER}`))
          if (pr.state === 'open' && !pr.draft) {
            // Paginate: an older bot event must never override a later human decision.
            const pages = JSON.parse(gh('api', `repos/${REPOSITORY}/issues/${NUMBER}/timeline?per_page=100`, '--paginate', '--slurp'))
            const latest = pages.flat().filter((event) => ['ready_for_review', 'converted_to_draft'].includes(event.event)).at(-1)
            if (!latest) throw new Error('Readiness history unavailable; inspect the PR before retrying.')
            if (latest.event === 'ready_for_review' && latest.actor?.login === 'linear-code[bot]') {
              gh('pr', 'ready', NUMBER, '--undo', '--repo', REPOSITORY)
              const current = JSON.parse(gh('api', `repos/${REPOSITORY}/pulls/${NUMBER}`))
              if (current.state === 'open' && !current.draft) throw new Error('Draft restoration did not persist; inspect concurrent readiness changes.')
              console.log('Restored draft. A human must decide readiness; Linear review-request automation is not approval.')
            } else {
              console.log('A later readiness decision supersedes this event; left the PR unchanged.')
            }
          } else {
            console.log('The PR is already draft or closed; left it unchanged.')
          }
# house:managed:end
