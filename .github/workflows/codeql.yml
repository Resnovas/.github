# Reusable CodeQL workflow: code scanning's advanced setup. Repositories call
# it through the house-codeql.yml workflow synced from
# templates/.github/workflows, and the house preset turns CodeQL default setup
# off, since GitHub rejects advanced results while default setup is on.
#
#   languages  maps the repository's GitHub languages to CodeQL languages,
#              always adding actions for the workflows themselves.
#   analyze    runs the security-extended queries, the suite default setup
#              ran, once per language under the same /language:<name>
#              category, so existing alerts carry over.
#
# A repository tunes the analysis with .github/codeql/codeql-config.yml, for
# example paths-ignore for vendored source; queries it lists are added to
# security-extended. The config is read from the base commit on pull requests
# and merge queue entries, like the workflow itself, so a change cannot narrow
# its own scan; a config change applies once it merges. Uses only the workflow
# token, so pull requests from forks and Dependabot run it with the same least
# privilege.
name: CodeQL

on:
  workflow_call:

permissions: {}

jobs:
  languages:
    name: languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Map the repository languages to CodeQL languages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The single quotes are deliberate: $ names inside are jq's, not the shell's.
          # shellcheck disable=SC2016
          matrix=$(gh api "repos/$REPOSITORY/languages" --jq '
            {
              "C": "c-cpp", "C++": "c-cpp", "C#": "csharp", "Go": "go",
              "Java": "java-kotlin", "Kotlin": "java-kotlin",
              "JavaScript": "javascript-typescript", "TypeScript": "javascript-typescript",
              "Python": "python", "Ruby": "ruby", "Rust": "rust"
            } as $codeql
            | [keys[] | $codeql[.] | select(. != null)] + ["actions"]
            | unique
            | map({language: ., "build-mode": (if . == "go" then "autobuild" else "none" end)})
            | {include: .}
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the analysis config from the base commit
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          # init reads a local config only from the workspace, which holds the
          # pull request's code, so it reads the base commit's file remotely.
          if gh api "repos/$REPOSITORY/contents/.github/codeql/codeql-config.yml?ref=$REF" \
            -H 'Accept: application/vnd.github.raw' > /dev/null 2> "$RUNNER_TEMP/codeql-config.err"; then
            echo "file=$REPOSITORY/.github/codeql/codeql-config.yml@$REF" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/codeql-config.err"; then
            echo "No .github/codeql/codeql-config.yml at $REF."
          else
            cat "$RUNNER_TEMP/codeql-config.err" >&2
            exit 1
          fi

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended
          config-file: ${{ steps.config.outputs.file }}

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
